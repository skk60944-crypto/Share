name: Build FlashShare APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Project Root
        run: |
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle(.kts) root folder-e nei! File-gulo subfolder theke baire root-e rakho."
            exit 1
          fi

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle (Using Wrapper)
        if: hashFiles('gradlew') != ''
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Gradle (Fallback without Wrapper)
        if: hashFiles('gradlew') == ''
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK (Signed Release or Debug Fallback)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          mkdir -p release_output

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore found - Building Signed Release APK..."
            echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > release.jks

            if [ "$KEY_ALIAS" = "upload" ]; then
              export KEYSTORE_PATH="$PWD/release.jks"
              export STORE_PASSWORD="$KEYSTORE_PASSWORD"
              $GRADLE_CMD assembleRelease --no-daemon --stacktrace

              RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
              if [ -z "$RAW_APK" ]; then
                echo "ERROR: Release APK pawa jayni!"
                exit 1
              fi
              cp "$RAW_APK" "release_output/FlashShare-v1.0.${{ github.run_number }}-release.apk"
            else
              # Temporary keystore matching build.gradle.kts alias 'upload', then re-signed with user's actual alias
              keytool -genkeypair -v \
                -keystore my-upload-key.jks \
                -storepass tempstorepass \
                -alias upload \
                -keypass tempkeypass \
                -keyalg RSA \
                -keysize 2048 \
                -validity 1 \
                -dname "CN=Temp,O=Temp,C=US"

              export KEYSTORE_PATH="$PWD/my-upload-key.jks"
              export STORE_PASSWORD="tempstorepass"
              export KEY_PASSWORD="tempkeypass"
              $GRADLE_CMD assembleRelease --no-daemon --stacktrace

              RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
              if [ -z "$RAW_APK" ]; then
                echo "ERROR: Release APK pawa jayni!"
                exit 1
              fi

              BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
              "$BUILD_TOOLS/zipalign" -v -p 4 "$RAW_APK" aligned.apk
              "$BUILD_TOOLS/apksigner" sign \
                --ks release.jks \
                --ks-key-alias "$KEY_ALIAS" \
                --ks-pass "pass:$KEYSTORE_PASSWORD" \
                --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
                --out "release_output/FlashShare-v1.0.${{ github.run_number }}-release.apk" \
                aligned.apk

              rm -f my-upload-key.jks aligned.apk
            fi

            rm -f release.jks
            echo "BUILD_TYPE=Release (Signed)" >> "$GITHUB_ENV"
          else
            echo "No keystore secrets found - Building Debug APK..."
            $GRADLE_CMD assembleDebug --no-daemon --stacktrace

            RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            if [ -z "$RAW_APK" ]; then
              echo "ERROR: Debug APK pawa jayni!"
              exit 1
            fi

            cp "$RAW_APK" "release_output/FlashShare-v1.0.${{ github.run_number }}-debug.apk"
            echo "BUILD_TYPE=Debug (Test)" >> "$GITHUB_ENV"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashShare-APK-${{ github.run_number }}
          path: release_output/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FlashShare v1.0.${{ github.run_number }} (${{ env.BUILD_TYPE }})
          body: |
            Automated APK build for **FlashShare**.
            - **Build Type:** ${{ env.BUILD_TYPE }}
            - **Run Number:** #${{ github.run_number }}
          files: release_output/*.apk
